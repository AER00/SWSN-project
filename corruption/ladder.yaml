# Corruption ladder.
#
# Every operator is declared here, seeded, and carries a `preserves_match` contract.
# Generation is deterministic: same config + same seed = byte-identical output.
#
#   dimension        which dirtiness dimension the operator instantiates (D1-D5)
#   target           headers | values | both
#   preserves_match  true  -> the correspondence survives; GT stays valid
#                    false -> allowed only if applied through a shared mapping to both
#                             sides, otherwise the build fails
#   repair           the canonicalisation component in src/swsn/extension/ that is
#                    supposed to undo it. One-to-one with the M4 ablation switches.
#
# One-sided by default: table A is corrupted, table B stays clean.

version: 1
seed: 42
sidedness: one            # one | two (two requires shared mappings for every operator)

levels:
  L0:
    description: "original tables, no corruption"
    operators: []

  L1:
    description: "header corruption — names only, values untouched"
    dimension: D1
    operators:
      - id: rename_synonym
        preserves_match: true
        repair: null           # names cannot be repaired by canonicalisation
        params:
          dictionary: data/lexicon/header_synonyms.yaml
      - id: rename_abbreviate
        preserves_match: true
        repair: null
        params: { style: [abbrev, acronym, snake_case, camelCase, spaced_words] }
      - id: rename_translate
        preserves_match: true
        repair: null
        params: { languages: [pt, es, de] }
      - id: append_unit_to_header
        preserves_match: true
        repair: null
        params: { units: ["(kg)", "[USD]", "/day", "%"] }
      - id: autogenerated_name
        preserves_match: true
        repair: null
        params: { patterns: ["Unnamed: {i}", "col_{i}", "V{i}", "field{i}"] }
      - id: duplicate_header
        preserves_match: true
        repair: null
        params: { max_duplicates: 2 }
      - id: reorder_columns
        preserves_match: true
        repair: null
        params: {}
      - id: add_spurious_column
        preserves_match: true
        repair: null
        params: { fraction: 0.1 }   # adds negatives to the candidate space

  L2:
    description: "value format corruption — same values, different encoding"
    dimension: D4
    operators:
      - id: date_reformat
        preserves_match: true
        repair: dates
        params: { formats: [iso, slash, european, long_text, epoch_seconds] }
      - id: number_thousand_separator
        preserves_match: true
        repair: numbers_and_units
        params: { style: [comma, space, apostrophe] }
      - id: number_decimal_comma
        preserves_match: true
        repair: numbers_and_units
        params: {}
      - id: currency_symbol
        preserves_match: true
        repair: numbers_and_units
        params: { position: [prefix, suffix], symbols: ["$", "R$", "€", "USD"] }
      - id: floatify
        preserves_match: true
        repair: numbers_and_units
        params: { example: "12345 -> 12345.0" }
      - id: zero_pad
        preserves_match: true
        repair: numbers_and_units
        params: { width: 8 }
      - id: id_prefix
        preserves_match: true
        repair: numbers_and_units
        params: { prefixes: ["ORD-", "ID_", "k"] }

  L3:
    description: "noise — sentinels, mixed types, whitespace, units inside values"
    dimension: D3
    operators:
      - id: sentinel_null
        preserves_match: true
        repair: sentinels_and_nulls
        params: { tokens: ["N/A", "n/a", "-", "unknown", "?", "null", "999", "-1"] }
      - id: mixed_type_in_column
        preserves_match: true
        repair: sentinels_and_nulls
        params: { fraction: 0.05 }   # inject text into a numeric column
      - id: whitespace_pad
        preserves_match: true
        repair: case_and_punctuation
        params: { leading: 0..2, trailing: 0..2 }
      - id: unicode_variants
        preserves_match: true
        repair: case_and_punctuation
        params: { dashes: true, quotes: true, non_breaking_space: true }
      - id: unit_in_value
        preserves_match: true
        repair: numbers_and_units
        params: { units: ["kg", "km", "cm", "BRL", "days"] }
      - id: case_variation_values
        preserves_match: true
        repair: case_and_punctuation
        params: { styles: [upper, lower, title, mixed] }

  L4:
    description: >
      semantic substitution — deliberately outside the extension's reach; the negative
      control that bounds the claim "normalisation is enough"
    dimension: D5
    operators:
      - id: synonym_substitute
        preserves_match: true
        repair: null
        params: { example: "São Paulo -> SP" }
      - id: translate_values
        preserves_match: true
        repair: null
        params: { languages: [en, pt] }
      - id: category_recode
        preserves_match: true
        repair: null
        params: { example: "credit_card -> CC" }

# ---------------------------------------------------------------------------
# Build-time integrity check. A `preserves_match: true` correspondence whose
# canonicalised value overlap falls below the threshold is a generator bug and
# fails the build; a deliberate destruction must be declared with preserve false.
# ---------------------------------------------------------------------------
integrity:
  # L4 substitutes value domains on purpose (translation, recoding). The column
  # correspondence is still true, but value overlap collapses by design, so the
  # automatic check would report a false violation. L4 is spot-checked instead.
  applies_to_levels: [L1, L2, L3]
  canonicalised_overlap_threshold: 0.5
  fail_build_on_violation: true
  report_destroyed_pairs_per_level: true
