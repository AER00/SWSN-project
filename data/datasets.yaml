# Table pairs. Each names two tables, the pair type (p_doc / p_natural / p_grain /
# p_split) and one sentence on why these two tables would be related in practice. A pair
# with no rationale is rejected by swsn.registry.
#
# p_doc      both tables from one documented dataset
# p_natural  two independent uploads in the same domain, no shared key
# p_grain    related tables at different grain (one order -> many payments)
# p_split    one table split in two; the control condition
pairs:

  # ------------------------------------------------------------------ Olist (c_doc)
  - id: olist_orders__payments
    a: {dataset: olist, table: olist_orders_dataset}
    b: {dataset: olist, table: olist_order_payments_dataset}
    pair_type: p_grain
    join_key: [order_id, order_id]
    rationale: "one order can be settled by several payment rows"
  - id: olist_orders__items
    a: {dataset: olist, table: olist_orders_dataset}
    b: {dataset: olist, table: olist_order_items_dataset}
    pair_type: p_grain
    join_key: [order_id, order_id]
    rationale: "one order contains one item row per product bought"
  - id: olist_items__products
    a: {dataset: olist, table: olist_order_items_dataset}
    b: {dataset: olist, table: olist_products_dataset}
    pair_type: p_doc
    join_key: [product_id, product_id]
    rationale: "each item row names the product it sells"
  - id: olist_items__sellers
    a: {dataset: olist, table: olist_order_items_dataset}
    b: {dataset: olist, table: olist_sellers_dataset}
    pair_type: p_doc
    join_key: [seller_id, seller_id]
    rationale: "each item row names the seller who fulfils it"
  - id: olist_orders__customers
    a: {dataset: olist, table: olist_orders_dataset}
    b: {dataset: olist, table: olist_customers_dataset}
    pair_type: p_doc
    join_key: [customer_id, customer_id]
    rationale: "each order is placed by exactly one customer"
  - id: olist_products__translation
    a: {dataset: olist, table: olist_products_dataset}
    b: {dataset: olist, table: product_category_name_translation}
    pair_type: p_doc
    rationale: >
      the translation table exists only to map products' Portuguese category names to
      English; the join is documented and the two sides carry different value wording
  - id: olist_customers__geolocation
    a: {dataset: olist, table: olist_customers_dataset}
    b: {dataset: olist, table: olist_geolocation_dataset}
    pair_type: p_doc
    join_key: [customer_zip_code_prefix, geolocation_zip_code_prefix]
    rationale: "customer addresses resolve to coordinates through the zip prefix"
  - id: olist_customers__sellers
    a: {dataset: olist, table: olist_customers_dataset}
    b: {dataset: olist, table: olist_sellers_dataset}
    pair_type: p_natural
    rationale: >
      no foreign key, but both describe Brazilian addresses in the same vocabulary;
      a name-similarity matcher has almost nothing to work with here

  # -------------------------------------------------------------- Instacart (c_doc)
  - id: instacart_orders__prior
    a: {dataset: instacart, table: orders}
    b: {dataset: instacart, table: order_products__prior}
    pair_type: p_grain
    join_key: [order_id, order_id]
    rationale: "one order lists many products"
  - id: instacart_products__aisles
    a: {dataset: instacart, table: products}
    b: {dataset: instacart, table: aisles}
    pair_type: p_doc
    join_key: [aisle_id, aisle_id]
    rationale: "every product belongs to exactly one aisle"
  - id: instacart_products__departments
    a: {dataset: instacart, table: products}
    b: {dataset: instacart, table: departments}
    pair_type: p_doc
    join_key: [department_id, department_id]
    rationale: "every product belongs to exactly one department"
  - id: instacart_prior__train
    a: {dataset: instacart, table: order_products__prior}
    b: {dataset: instacart, table: order_products__train}
    pair_type: p_split
    join_key: [order_id, order_id]
    rationale: >
      the same schema over disjoint orders — a control where name evidence is perfect
      and value overlap on the key is exactly zero

  # ------------------------------------------------------------------ C-nat pairs
  - id: cardekho_data__cardetails
    a: {dataset: cardekho_vehicles, table: car data}
    b: {dataset: cardekho_vehicles, table: CAR DETAILS FROM CAR DEKHO}
    pair_type: p_natural
    rationale: >
      two uploads of the same Indian used-car domain under different naming
      conventions (snake_case vs spaced Title Case)
  - id: cardekho_v3__v4
    a: {dataset: cardekho_vehicles, table: Car details v3}
    b: {dataset: cardekho_vehicles, table: car details v4}
    pair_type: p_natural
    rationale: "same domain, the richest column sets on each side, different conventions"
  - id: melbourne_full__less
    a: {dataset: melbourne_housing, table: Melbourne_housing_FULL}
    b: {dataset: melbourne_housing, table: MELBOURNE_HOUSE_PRICES_LESS}
    pair_type: p_split
    rationale: >
      LESS is a documented projection of FULL: same keys, eight columns dropped. Ground
      truth is the column intersection, so it needs no annotation
  - id: airbnb__melbourne
    a: {dataset: airbnb_nyc, table: AB_NYC_2019}
    b: {dataset: melbourne_housing, table: Melbourne_housing_FULL}
    pair_type: p_natural
    rationale: >
      two independent uploads describing short-term rentals by price, room/bedroom count
      and coordinates, in different cities and under different column names
  - id: heart__diabetes
    a: {dataset: heart_failure, table: heart}
    b: {dataset: diabetes, table: diabetes_prediction_dataset}
    pair_type: p_natural
    rationale: >
      two independent clinical uploads sharing risk factors (age, sex, BMI, smoking,
      hypertension) under CamelCase vs snake_case conventions
  - id: craigslist__cardekho
    a: {dataset: craigslist_cars, table: vehicles}
    b: {dataset: cardekho_vehicles, table: Car details v3}
    pair_type: p_natural
    rationale: >
      the same used-car domain from two continents: craigslist is free text and mostly
      null, cardekho is structured — the hardest pair in the collection
