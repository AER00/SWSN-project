# Dataset registry.
#
# Every dataset used by the project is declared here. `make data` downloads each entry,
# verifies its checksum (once recorded) and writes the files to data/raw/<id>/.
#
# Fields
#   id            short local name, used as the folder and the key everywhere else
#   class         c_doc (documented multi-table) | c_nat (independent single tables)
#   domain        used for the "variety" argument in the report
#   kaggle_slug   owner/dataset on Kaggle; must be a public *Dataset* (competitions need auth)
#   version       kagglehub version number, pinned after triage
#   sha256        per-file checksums, filled after the first download
#   licence       recorded verbatim from the dataset page, with a link
#   status        candidate -> admitted | dropped (with a reason)
#
# Do not invent entries: a dataset is admitted only after the triage gate in
# milestone2-plan.md §1.1 has been applied to the downloaded files.

