[project]
name = "swsn-valentine-messy-tables"
version = "0.1.0"
description = "Valentine on messy Kaggle tables — analysis, corruption ladder and normalisation-aware matching"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = { text = "MIT" }
authors = [
    { name = "Ashley Jurga" },
    { name = "Paweł Laszczyk" },
    { name = "Jakub Laskowski" },
    { name = "Jakub Górniak" },
]
dependencies = [
    "valentine>=1.1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "kagglehub>=0.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swsn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
